<style id="v1793style">

  background:#80673b;border:2px solid #111516;border-radius:12px
}

.history-scroll::-webkit-scrollbar-thumb:hover{background:#b08d4b}

}

 };

function localDateISO(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function localDateFrom(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayISOShift(iso,n){let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return localDateFrom(d)}
function primaryRecipient(x){const index={gift:1,wire:3,crypto:2,ach:3}[x.type]??1;return String((x.source||[])[index]||'').trim()||'—'}
function recipientCaption(type){return ({gift:'Redeemed Gift Card Code / Reference',wire:'First Receiving Bank Account',crypto:'Initial Recipient Wallet Address',ach:'Receiving Deposit Account'})[type]}
function traceWindow(x){
 const today=localDateISO(),raw=/^\d{4}-\d\d-\d\d$/.test(x.date||'')?x.date:today;
 const start=raw>today?today:raw;
 const d=new Date(start+'T12:00:00');const originalDay=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+2);const endOfMonth=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(originalDay,endOfMonth));
 const twoMonths=localDateFrom(d);
 const elapsedDays=Math.max(0,Math.round((Date.parse(today+'T12:00:00')-Date.parse(start+'T12:00:00'))/86400000));
 const cutoffDays=elapsedDays>=15?15:7;
 const cutoff=dayISOShift(today,-cutoffDays);
 const end=twoMonths<=today?twoMonths:(cutoff>=start?cutoff:start);
 return {start,end,opened:localDateFrom(new Date(x.created||Date.now())),generated:today,mode:twoMonths<=today?'two-month':elapsedDays>=15?'fifteen-day-cutoff':elapsedDays>=7?'seven-day-cutoff':'origin-clamped',cutoffDays,elapsedDays};
}

function traceSummary(x){
 let A=Math.max(0,Number(x.tracedAmount)||0),nums=[1,8,22,44,61,20,10,1],ratios=[1,.9921,.9872,.9804,.9741,.9648,.9551,.94648];
 let layers=nums.map((count,i)=>({count,amount:Math.round(A*ratios[i]*100)/100}));
 return {layers,final:layers[7].amount,fees:Math.round((A-layers[7].amount)*100)/100};
}
function railFor(type,i){let lists={gift:['RETAIL / CARD','MERCHANT REDEMPTION','P2P MARKETPLACE','USDT / TRON','BRIDGE / EVM','DEX / MIXER','OTC / FIAT','WISE / GBP'],wire:['FEDWIRE / SWIFT','BANK ACCOUNT','CORRESPONDENT BANK','INTERNAL LEDGER','INTERBANK TRANSFER','FIAT / CRYPTO','OTC SETTLEMENT','WISE / GBP'],crypto:['INITIAL BLOCKCHAIN','WALLET CLUSTER','DEX AGGREGATOR','BRIDGE / ERC20','ETH / TRON','MIXER / ROUTER','OTC DESK','WISE / GBP'],ach:['ACH / NACHA','RDFI POSTING','DEPOSIT ACCOUNT','INTERNAL SWEEP','INTERBANK PAYMENT','DIGITAL ASSET','FOREIGN SETTLEMENT','WISE / GBP']};return lists[type][i%8]}
function movementRows(x){
 const layers=traceSummary(x).layers,t=TYPES[x.type],v=traceWindow(x),results=[];
 const start=Date.parse(v.start+'T09:12:00Z'),end=Date.parse(v.end+'T17:30:00Z');
 let eventIndex=0;
 for(let i=0;i<layers.length;i++){
  const n=layers[i].count,stageCents=Math.round(layers[i].amount*100),base=Math.floor(stageCents/n),rem=stageCents-base*n;
  for(let j=0;j<n;j++){
   eventIndex++;const cents=base+(j<rem?1:0);
   const factor=(eventIndex-1)/166;
   const utc=new Date(Math.round(start+(end-start)*factor)).toISOString().slice(0,16).replace('T',' ')+'Z';
   results.push({id:'EV-'+String(eventIndex).padStart(4,'0'),utc,
     from:i===0?primaryRecipient(x):'CL-'+String(Math.max(1,i*3-2+(j%3))).padStart(2,'0'),
     to:i===7?'WISE-UK-01':'CL-'+String(i*3+1+(j%3)).padStart(2,'0'),
     amount:cents/100,tag:i===0?'ORIGIN':i===7?'FIAT SINK':(['REDEMPTION','SPLIT','BRIDGE','CONVERSION','ROUTING','AGGREGATION'][i-1]||'SETTLEMENT'),
     stage:t.stages[i],rail:railFor(x.type,i)});
  }
 }
 return results;
}

function selectType(type){
 let x=c(); if(!TYPES[type])return;
 if(!x.sourceByType)x.sourceByType={};
 x.sourceByType[x.type]=Array.isArray(x.source)?x.source.slice():['','','',''];
 x.type=type;x.source=(x.sourceByType[type]||['','','','']).slice();uiType=type;persist();
}
function updateSource(i,val){
 let x=c();if(!Array.isArray(x.source))x.source=['','','',''];
 const prevHash=x.source[1],prevFee=x.source[4];x.source[i]=val;
 if(x.type==='crypto'&&i===0){
  if(x.cryptoAutofillHash&&prevHash===x.cryptoAutofillHash){x.source[1]=cryptoSampleHash(val);x.cryptoAutofillHash=x.source[1]}
  if(x.cryptoAutofillFee&&prevFee===x.cryptoAutofillFee){x.source[4]=cryptoSampleFee(val);x.cryptoAutofillFee=x.source[4]}
 }
 if(!x.sourceByType)x.sourceByType={};x.sourceByType[x.type]=x.source.slice();persist()
}

function maskReference(raw){
 const s=String(raw??'').trim();if(!s||s==='—')return '—';
 if(/^CL-\d+$/.test(s)||/^EV-\d+$/.test(s)||/^WISE-UK-\d+$/.test(s)||/^BNK-[A-Z0-9-]+$/.test(s))return s;
 const tight=s.replace(/\s/g,'');
 if(tight.length<=8)return s;
 if(/^(?:0x)?[A-Fa-f0-9]{24,}$/.test(tight))return tight.slice(0,8)+'••••••'+tight.slice(-6);
 if(/^[\d\s-]{12,}$/.test(s))return tight.slice(0,4)+' **** **** '+tight.slice(-4);
 if(/^[A-Z]{2}\d{2}[A-Z0-9]{10,}$/.test(tight))return tight.slice(0,4)+'••••••'+tight.slice(-4);
 return s.slice(0,5)+'••••••'+s.slice(-4);
}

function rawMoneyValue(value){
  let raw=String(value??'').replace(/,/g,'').replace(/[^0-9.]/g,'');
  const dot=raw.indexOf('.');
  if(dot!==-1)raw=raw.slice(0,dot+1)+raw.slice(dot+1).replace(/\./g,'').slice(0,2);
  return raw;
}
function commaMoneyEditing(value){
  const raw=rawMoneyValue(value),dot=raw.indexOf('.');
  let integer=(dot<0?raw:raw.slice(0,dot)).replace(/^0+(?=\d)/,'');
  integer=integer.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return dot<0?integer:integer+'.'+raw.slice(dot+1);
}
function moneyForEntry(value){
  let n=Number(rawMoneyValue(value));
  return Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'0.00';
}
function editMoneyEntry(element,property){
  const previous=element.value;
  const selection=element.selectionStart??previous.length;
  const meaningful=previous.slice(0,selection).replace(/[^0-9.]/g,'').length;
  const display=commaMoneyEditing(previous);
  element.value=display;
  let count=0,pos=0;
  while(pos<display.length && count<meaningful){if(/[0-9.]/.test(display[pos]))count++;pos++}
  element.setSelectionRange(pos,pos);
  updateCase(property,rawMoneyValue(display));
}
function finishMoneyEntry(element,property){
  const raw=rawMoneyValue(element.value),num=Number(raw||0);
  const safe=Number.isFinite(num)?Math.max(0,num):0;
  element.value=moneyForEntry(safe);
  updateCase(property,safe.toFixed(2));
  // Refresh the supporting amount summaries without destroying the input focus or its caret.
  const scope=element.closest('.leftcol')?.querySelector('.metrics-strip');
  if(scope){
    const matter=c();
    const values=[Number(matter.amount)||0,Number(matter.tracedAmount)||0,Math.max(0,(Number(matter.amount)||0)-(Number(matter.tracedAmount)||0))];
    scope.querySelectorAll('b').forEach((item,i)=>{if(i<values.length)item.textContent=formatMoney(values[i])});
  }
}
function fakeRandomBytes(length){
  const a=new Uint8Array(length);
  if(window.crypto?.getRandomValues)window.crypto.getRandomValues(a);
  else for(let i=0;i<length;i++)a[i]=Math.floor(Math.random()*256);
  return a;
}
function cryptoSampleHash(network){
  const n=String(network||'Ethereum').toLowerCase(),bytes=fakeRandomBytes(32),hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  if(n.includes('solana')){
    const abc='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    const bytes=fakeRandomBytes(84);
    return Array.from(bytes,b=>abc[b%abc.length]).join('');
  }
  return n.includes('bitcoin')?hex:'0x'+hex;
}
function cryptoSampleFee(network){
  const n=String(network||'Ethereum').toLowerCase(),z=fakeRandomBytes(2),r=((z[0]<<8)|z[1])/65535;
  if(n.includes('bitcoin'))return (0.000018+r*0.00011).toFixed(6)+' BTC';
  if(n.includes('tron'))return (0.55+r*2.45).toFixed(3)+' TRX';
  if(n.includes('solana'))return (0.000005+r*0.00002).toFixed(6)+' SOL';
  if(n.includes('bnb'))return (0.00009+r*0.00035).toFixed(6)+' BNB';
  if(n.includes('polygon'))return (0.01+r*0.11).toFixed(4)+' POL';
  return (0.00024+r*0.0015).toFixed(6)+' ETH';
}
function ensureCryptoDefaults(x){
  if(x.cryptoDefaultsApplied)return;
  if(!Array.isArray(x.source))x.source=[];
  if(!x.sourceByType)x.sourceByType={};
  if(!x.source[0])x.source[0]='Ethereum';
  if(!x.source[1]){x.source[1]=cryptoSampleHash(x.source[0]);x.cryptoAutofillHash=x.source[1]}
  if(!x.source[4]){x.source[4]=cryptoSampleFee(x.source[0]);x.cryptoAutofillFee=x.source[4]}
  if(!x.source[5])x.source[5]='Other';
  x.sourceByType.crypto=x.source.slice();
  x.cryptoDefaultsApplied=true;
  persist();
}

 const v=String(txt||'').trim();let m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(!m) return null;

 return String(year).padStart(4,'0')+'-'+String(mon).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
