const icon=(name,size=17)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.file}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon,16)});
const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t));
const state={db:null,templates:[],activeId:null,active:null,document:null,filter:'all',search:'',sideSearch:'',loading:false,dragId:null,loadSeq:0,busy:false};
const DB='docx-han-placeholder-studio',DB_VERSION=1;
/* Resilient local-only draft cache. Online master documents are stored separately
   in Cloudflare and are not modified by an IndexedDB failure. */
let khmbDatabaseOpening=null;
function openDatabase(){
 return new Promise((resolve,reject)=>{
  let req;
  try{req=indexedDB.open(DB,DB_VERSION);}catch(e){reject(e);return;}
  req.onupgradeneeded=()=>{
   const db=req.result;
   if(!db.objectStoreNames.contains('templates'))db.createObjectStore('templates',{keyPath:'id'});
   if(!db.objectStoreNames.contains('docs'))db.createObjectStore('docs',{keyPath:'id'});
  };
  req.onsuccess=()=>{
   const db=req.result;
   db.onversionchange=()=>{
    if(state.db===db)state.db=null;
    try{db.close();}catch{}
   };
   db.onclose=()=>{if(state.db===db)state.db=null;};
   state.db=db;
   resolve(db);
  };
  req.onerror=()=>reject(req.error||new Error('打开本地数据库失败'));
  req.onblocked=()=>reject(new Error('本地存储正在被其他页面升级占用，请关闭其他旧版页面后重试'));
 });
}
async function khmbEnsureDatabase(){
 if(state.db)return state.db;
 if(!khmbDatabaseOpening)
  khmbDatabaseOpening=openDatabase().finally(()=>{khmbDatabaseOpening=null;});
 return khmbDatabaseOpening;
}
function khmbDatabaseWasClosed(error){
 const message=String(error?.message||'').toLowerCase();
 return error?.name==='InvalidStateError'||/database connection is clos|database.*(is closed|closed)|connection.*clos|connection.*terminat|database.*closing/.test(message);
}
async function dbOp(store,mode,method,args){
 for(let attempt=0;attempt<2;attempt++){
  let db;
  try{
   db=await khmbEnsureDatabase();
   return await new Promise((resolve,reject)=>{
    let tx;
    try{
     tx=db.transaction(store,mode);
     const request=tx.objectStore(store)[method](...args);
     let result;
     request.onsuccess=()=>{result=request.result;};
     tx.oncomplete=()=>resolve(result);
     tx.onabort=()=>reject(tx.error||request.error||new Error('本地数据库事务取消'));
    }catch(e){reject(e);}
   });
  }catch(e){
   if(attempt!==0||!khmbDatabaseWasClosed(e))throw e;
   if(state.db===db){
    state.db=null;
    try{db.close();}catch{}
   }
   // Opening is shared across concurrent draft saves; retry the same idempotent operation once.
  }
 }
}
const allMeta=()=>dbOp('templates','readonly','getAll',[]);
const getDoc=async id=>{const r=await fetch('/api/admin/docx/templates/'+encodeURIComponent(id)+'/docx',{cache:'no-store'});if(!r.ok)throw Error('模板下载失败（'+r.status+'）');const version=Number(r.headers.get('X-Template-Version'));if(!Number.isSafeInteger(version)||version<1)throw Error('服务器未提供有效的原模板版本，请刷新页面重试');const m=state.templates.find(t=>t.id===id);return {id,blob:await r.blob(),contentVersion:version,filename:m?.filename||((m?.name||'模板')+'.docx')};};
const putMeta=meta=>dbOp('templates','readwrite','put',[{...meta,values:{...(meta.values||{})},directEdits:state.isAdmin?{...(meta.directEdits||{})}:{}}]);
const putDoc=rec=>dbOp('docs','readwrite','put',[rec]);
const deleteMeta=id=>dbOp('templates','readwrite','delete',[id]);
const deleteDoc=id=>dbOp('docs','readwrite','delete',[id]);
function ordered(){return state.templates.slice().sort((a,b)=>(a.order??0)-(b.order??0)||(a.createdAt??0)-(b.createdAt??0));}
function toast(message,kind='success'){const el=document.createElement('div');el.className=`toast ${kind}`;el.innerHTML=`${icon(kind==='error'?'alert':'check',16)}<span>${esc(message)}</span>`;$('#toastArea').append(el);setTimeout(()=>el.remove(),4200);}
function bytesSize(n){if(n<1024)return `${n} B`;if(n<1048576)return `${(n/1024).toFixed(1)} KB`;return `${(n/1048576).toFixed(2)} MB`;}
function secureFileName(raw){let n=String(raw||'').replace(/\.docx$/i,'').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').replace(/[. ]+$/g,'').trim();if(/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i.test(n))n='文档_'+n;return n.slice(0,150);}
function documentName(file){return file.name.replace(/\.docx$/i,'');}
function uuid(){return (crypto.randomUUID?.()||'doc_'+Date.now()+'_'+Math.random().toString(36).slice(2));}
function renderSidebar(){const list=$('#templateList');const items=ordered().filter(t=>`${t.name} ${t.outputName||''}`.toLowerCase().includes(state.sideSearch.toLowerCase()));$('#sidebarCount').textContent=state.templates.length;if(!items.length){list.innerHTML=`<div class="empty-side">${state.templates.length?'未找到匹配的模板':'共享模板库暂为空<br>请管理员登录后上传 DOCX'}</div>`;return;}list.innerHTML=items.map(t=>`<div class="template-item ${t.id===state.activeId?'active':''}" role="button" tabindex="0" draggable="true" data-id="${esc(t.id)}" title="拖动可调整排序"><span class="tiny-file">${icon('file',18)}</span><div class="template-detail"><div class="template-name" title="${esc(t.name)}">${esc(t.name)}</div><div class="template-secondary">${t.outputName?'输出：'+esc(t.outputName)+'.docx':'待设置输出文件名'}</div></div><button type="button" class="item-actions" data-action="menu" title="模板管理" aria-label="管理模板">${icon('more',16)}</button></div>`).join('');}
function emptyWorkspace(){return `<div class="hero-empty" id="dropTarget"><div class="hero-drawing"><div class="big-doc"></div><div class="badge-doc">DOCX</div></div><h2>上传模板，一次填好所有中文占位内容</h2><p>自动查找正文、表格、页眉页脚等位置的中文文字。填写替换内容后导出 Word 文档，其他未编辑内容与原有排版保持不变。</p><div class="hero-buttons"><button class="btn primary" id="uploadHero">${icon('plus',17)} 导入 Word 模板</button></div><div class="key-points"><div class="key-point">${icon('shield',15)} 纯本地编辑</div><div class="key-point">${icon('layers',15)} 自动保存模板</div><div class="key-point">${icon('check',15)} 精确文字替换</div></div></div>`;}
function loadingWorkspace(){return `<div class="loading-screen"><div class="loader"></div>正在读取 Word 文档并识别中文…</div>`;}
function counts(){let groups=state.document?.groups||[];let done=groups.filter(g=>(state.active?.values?.[g.text]??'')!=='').length;let instances=groups.reduce((x,g)=>x+g.occurrences.length,0);return{total:groups.length,done,pending:groups.length-done,instances,pct:groups.length?Math.round(done/groups.length*100):0};}

let persistQueue=Promise.resolve();
function persistMeta(m,{quiet=false,version=null}={}){
 const snapshot={...m,values:{...(m.values||{})},directEdits:state.isAdmin?{...(m.directEdits||{})}:{},
  draftVersion:version??state.loadedTemplateVersion??m.contentVersion??1};
 persistQueue=persistQueue.catch(()=>false).then(()=>putMeta(snapshot)).then(()=>true).catch(e=>{
  if(quiet)console.warn('线上操作已完成，但浏览器本地草稿缓存未写入：',e);
  else toast('保存本地编辑内容失败：'+e.message,'error');
  return false;
 });
 return persistQueue;
}
function decodeXML(s){return s.replace(/&(#x[\da-fA-F]+|#\d+|amp|lt|gt|quot|apos);/g,(_,id)=>{if(id[0]==='#'){let num=id[1].toLowerCase()==='x'?parseInt(id.slice(2),16):parseInt(id.slice(1),10);try{return String.fromCodePoint(num)}catch{return '�'}}return ({amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"})[id]||'&'+id+';';});}
function xmlEscapeText(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const STORY_FILE=/^word\/(?:document|header\d*|footer\d*|footnotes|endnotes|comments|glossary\/document)\.xml$/i;
const HAN_PATTERN=/\p{Script=Han}+(?:[（(][^\u0000\r\n（）()]{1,32}[）)])?/gu;
function analyzeXML(xml,part){const regex=/<w:t(?=[\s>])[^>]*>([\s\S]*?)<\/w:t>/g;let nodes=[],stream='',map=[],match,prevEnd=0;
while((match=regex.exec(xml))){const full=match[0],inner=match[1];const headLength=full.indexOf('>')+1;const decoded=decodeXML(inner);const before=xml.slice(prevEnd,match.index);if(nodes.length&&(/<\/w:p(?:\s[^>]*)?>|<\/w:tc(?:\s[^>]*)?>|<w:(?:tab|br|cr|lastRenderedPageBreak)\b|<w:fldChar\b/i.test(before))){stream+='\u0000';map.push(null);}const index=nodes.length;nodes.push({fullStart:match.index,fullEnd:match.index+full.length,head:full.slice(0,headLength),endTag:'</w:t>',inner,decoded});for(let i=0;i<decoded.length;i++){stream+=decoded[i];map.push({node:index,offset:i});}prevEnd=regex.lastIndex;}
const occurrences=[];HAN_PATTERN.lastIndex=0;let m;while((m=HAN_PATTERN.exec(stream))){const start=map[m.index],end=map[m.index+m[0].length-1];if(!start||!end)continue;let a=Math.max(0,m.index-34),b=Math.min(stream.length,m.index+m[0].length+34);a=stream.lastIndexOf('\u0000',m.index-1)+1||a;if(a>m.index)a=Math.max(0,m.index-34);let sep=stream.indexOf('\u0000',m.index+m[0].length);if(sep>=0)b=Math.min(b,sep);const context=stream.slice(Math.max(a,m.index-34),b).replace(/\u0000/g,' ').replace(/\s+/g,' ');occurrences.push({part,startNode:start.node,startOffset:start.offset,endNode:end.node,endOffset:end.offset+1,text:m[0],context});}return{part,xml,nodes,occurrences};}
async function parseDocx(blob){let zip;try{zip=await JSZip.loadAsync(blob)}catch{throw new Error('文件不是有效的 DOCX（ZIP）文档，或已加密/损坏。')}if(!zip.file('word/document.xml')||!zip.file('[Content_Types].xml'))throw new Error('未找到 Word 正文，无法识别为标准 DOCX 文件。');const paths=Object.keys(zip.files).filter(n=>STORY_FILE.test(n)).sort((a,b)=>a==='word/document.xml'?-1:b==='word/document.xml'?1:a.localeCompare(b));let parts=[],groups=new Map();for(let name of paths){let xml=await zip.file(name).async('string');let data=analyzeXML(xml,name);parts.push(data);for(let occ of data.occurrences){if(!groups.has(occ.text))groups.set(occ.text,{text:occ.text,occurrences:[]});groups.get(occ.text).occurrences.push(occ);}}return{zip,parts,groups:[...groups.values()],groupMap:groups};}
function manualKey(part,index){return `${part}#${index}`;}
function manualEntriesFor(part){const result=new Map(),edits=state.active?.directEdits||{};for(let i=0;i<part.nodes.length;i++){const key=manualKey(part.part,i);if(Object.prototype.hasOwnProperty.call(edits,key))result.set(i,edits[key]);}return result;}
function applyReplacements(part,changes,manual=new Map()){
 if(!changes.length&&!manual.size)return part.xml;
 const operations=new Map();
 for(let occ of changes){
   // A direct visual edit to any node in a grouped placeholder overrides that ONE occurrence.
   if(Array.from({length:occ.endNode-occ.startNode+1},(_,i)=>occ.startNode+i).some(n=>manual.has(n)))continue;
   for(let n=occ.startNode;n<=occ.endNode;n++){
     const node=part.nodes[n];if(!node)throw new Error('文档中的文字定位信息异常');
     const start=n===occ.startNode?occ.startOffset:0,end=n===occ.endNode?occ.endOffset:node.decoded.length;
     if(!operations.has(n))operations.set(n,[]);
     operations.get(n).push({start,end,replacement:n===occ.startNode?occ.replacement:''});
   }
 }
 const allNodes=new Set([...operations.keys(),...manual.keys()]);let xml=part.xml;
 for(let idx of [...allNodes].sort((a,b)=>b-a)){
   const node=part.nodes[idx];if(!node)throw new Error('手动编辑的文字定位信息异常');
   let value=manual.has(idx)?manual.get(idx):node.decoded;
   if(!manual.has(idx))for(const op of operations.get(idx).sort((a,b)=>b.start-a.start))value=value.slice(0,op.start)+op.replacement+value.slice(op.end);
   let head=node.head;
   if((value.startsWith(' ')||value.endsWith(' ')||value.startsWith('\t')||value.endsWith('\t'))&&!/xml:space\s*=/.test(head))head=head.replace(/>$/,' xml:space="preserve">');
   const full=head+xmlEscapeText(value)+node.endTag;
   xml=xml.slice(0,node.fullStart)+full+xml.slice(node.fullEnd);

}
async function buildOutput(){
 const d=state.document;
 for(const p of d.parts){
   const manual=manualEntriesFor(p);
   const changes=p.occurrences.map(o=>({...o,replacement:state.active.values[o.text]??''})).filter(o=>o.replacement!=='');
   const updated=applyReplacements(p,changes,manual);
   d.zip.file(p.part,updated,{createFolders:false});

}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}

async function loadTemplate(id,scrollTop=true){let t=state.templates.find(x=>x.id===id);if(!t)return;if(!state.isAdmin)t.directEdits={};const seq=++state.loadSeq;state.activeId=id;state.active=t;state.document=null;state.loadedTemplateVersion=null;state.currentKey=null;state.selectedOccId=null;state.directUndo=[];state.lastDirectParagraph=null;state.filter='all';state.search='';state.loading=true;renderSidebar();renderWorkspace(scrollTop);try{const rec=await getDoc(id);if(!rec?.blob)throw new Error('保存的模板内容不存在');const doc=await parseDocx(rec.blob);if(seq!==state.loadSeq)return;state.loadedTemplateVersion=rec.contentVersion;state.document=doc;state.loading=false;renderWorkspace(scrollTop);}catch(e){if(seq!==state.loadSeq)return;state.loading=false;state.document=null;$('#workspace').innerHTML=`<div class="no-fields">读取模板失败：${esc(e.message)}<div style="margin-top:18px"><button class="btn" id="retryLoad">重试读取</button></div></div>`;$('#retryLoad').onclick=()=>loadTemplate(id);toast('读取失败：'+e.message,'error');}}
async function importDocxFiles(files){files=Array.from(files).filter(f=>f.name.toLowerCase().endsWith('.docx'));if(!files.length){toast('请选择 .docx 格式的文件','error');return;}let added=0,lastId=null;for(const f of files){try{if(f.size>100*1024*1024)throw new Error('单份文件不能超过 100 MB');if(f.size===0)throw new Error('文件为空');const doc=await parseDocx(f);const id=uuid(),meta={id,name:documentName(f),filename:f.name,size:f.size,outputName:'',values:{},directEdits:{},order:state.templates.length,createdAt:Date.now()};await putDoc({id,blob:new Blob([await f.arrayBuffer()],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),filename:f.name});await putMeta(meta);state.templates.push(meta);lastId=id;added++;}catch(e){toast(`${f.name}：${e.message}`,'error');}}renderSidebar();if(added){toast(`已保存 ${added} 份模板，下次打开仍可使用`);await loadTemplate(lastId);} }

function showModal({iconName='edit',title,description='',input=false,initial='',placeholder='',label='',warning='',confirmText='确定',cancelText='取消',danger=false,onConfirm}){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-tag">${icon(iconName,21)}</div><h3 id="modalTitle">${esc(title)}</h3><p>${esc(description)}</p>${input?`<div class="modal-k">${esc(label)}</div><input class="modal-input" id="modalEntry" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder)}" value="${esc(initial)}" maxlength="150"/>`:''}${warning?`<div class="modal-warning">${esc(warning)}</div>`:''}<div class="modal-foot"><button class="btn" id="modalCancel">${esc(cancelText)}</button><button class="btn ${danger?'danger':'primary'}" id="modalConfirm">${esc(confirmText)}</button></div></div></div>`;const close=()=>{root.innerHTML='';};$('#modalCancel').onclick=close;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')close();});const submit=async()=>{let value=input?$('#modalEntry').value:'';if(input&&!secureFileName(value)){toast('请填写有效的文件名称','error');$('#modalEntry').focus();return;}close();try{await onConfirm?.(input?secureFileName(value):undefined);}catch(e){toast(e.message,'error');}};$('#modalConfirm').onclick=submit;if(input){$('#modalEntry').focus();$('#modalEntry').select();$('#modalEntry').onkeydown=e=>{if(e.key==='Enter')submit();};}const keydown=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',keydown);}};document.addEventListener('keydown',keydown,{once:true});}
function confirmDeletion(meta){showModal({iconName:'trash',title:'删除这份模板？',description:`即将删除「${meta.name}」及其保存的填写记录。此操作无法撤销，请先备份重要模板。`,confirmText:'永久删除',danger:true,onConfirm:async()=>{await deleteMeta(meta.id);await deleteDoc(meta.id);state.templates=state.templates.filter(x=>x.id!==meta.id);if(state.activeId===meta.id){++state.loadSeq;state.activeId=null;state.active=null;state.document=null;}renderSidebar();renderWorkspace();toast('模板已删除');if(!state.active&&state.templates.length)await loadTemplate(ordered()[0].id);}});}

async function beginExport(){if(!state.document||state.busy)return;const id=state.activeId;if(!secureFileName(state.active.outputName)){showModal({iconName:'edit',title:'先设置导出文件名',description:'该模板还没有固定输出文件名。请填写名称，保存后下次导出将自动使用。',input:true,label:'文档文件名',placeholder:'例如：客户协议-正式版',confirmText:'保存并继续',onConfirm:async(value)=>{if(state.activeId!==id)return;state.active.outputName=value;await persistMeta(state.active);renderSidebar();renderWorkspace();checkPendingAndExport();}});return;}checkPendingAndExport();}
function checkPendingAndExport(){const c=counts();if(c.pending>0){showModal({iconName:'alert',title:`还有 ${c.pending} 项中文未填写`,description:'尚未填写的中文会原样保留在导出的 DOCX 中。你可以继续填写，也可以先导出当前结果。',confirmText:'仍然导出',warning:'只会替换有新内容的字段，不会自动删除任何未填写的中文。',onConfirm:performExport});}else performExport();}
async function performExport(){if(state.busy||!state.active||!state.document)return;state.busy=true;const button=$('#exportButton');if(button){button.disabled=true;button.textContent='正在生成 DOCX…';}try{const result=await buildOutput();downloadBlob(result,secureFileName(state.active.outputName)+'.docx');toast('DOCX 已生成并开始下载');}catch(e){toast('导出失败：'+e.message,'error');}finally{state.busy=false;if($('#exportButton')){$('#exportButton').disabled=false;$('#exportButton').innerHTML=`${icon('download',17)} 导出 DOCX`;}}}
async function makeBackup(){if(!state.templates.length){toast('模板库为空，暂无内容可备份','error');return;}try{const zip=new JSZip();const meta=[];for(const m of ordered()){const doc=await getDoc(m.id);if(!doc?.blob)continue;const path=`templates/${m.id}.docx`;zip.file(path,doc.blob);meta.push({metadata:{...m},path,filename:doc.filename});}zip.file('backup.json',JSON.stringify({app:'docx-han-placeholder-studio',formatVersion:1,createdAt:new Date().toISOString(),items:meta},null,2));const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});const date=new Date().toISOString().slice(0,10);downloadBlob(blob,`DOCX模板库备份_${date}.zip`);toast(`已备份 ${meta.length} 份模板及填写记录`);}catch(e){toast('备份失败：'+e.message,'error');}}

    const last=group.pieces.find(p=>b-1>=p.start&&b-1<p.start+p.len);

/* CSS Custom Highlight API: paint every exact text hit red without injecting spans
   into contenteditable DOCX text. Ranges are rebuilt after preview re-renders. */
const KHMB_ALL_MARK='khmb-find-all',KHMB_ACTIVE_MARK='khmb-find-active';
state.khmbActiveMatchIndex=null;
function khmbClearPreviewHighlights(){
 if(typeof CSS!=='undefined'&&CSS.highlights){
  CSS.highlights.delete(KHMB_ALL_MARK);
  CSS.highlights.delete(KHMB_ACTIVE_MARK);
 }
 document.querySelectorAll('#previewScroller .docx-p.khmb-search-target').forEach(el=>el.classList.remove('khmb-search-target'));
}
function khmbPreviewParagraphIndex(){
 const byNode=new Map();
 for(const p of document.querySelectorAll('#previewScroller .docx-p')){
  const info=p._wordEdit;
  if(!info)continue;
  for(const seg of info.segments){
   if(seg.index==null)continue;
   const key=info.part+'#'+seg.index;
   if(!byNode.has(key))byNode.set(key,p);
  }
 }
 return byNode;
}
function khmbPreviewTextPositions(para){
 const walker=document.createTreeWalker(para,NodeFilter.SHOW_TEXT);
 const text=[];let position=0;
 while(walker.nextNode()){
  const n=walker.currentNode;
  if(!n.nodeValue||n.parentElement?.closest('.docx-list-prefix'))continue;
  const len=n.nodeValue.length;
  text.push({node:n,start:position,end:position+len});
  position+=len;
 }
 return text;
}
function khmbPreviewMatchRange(hit,paragraphs,nodeCache){
 const el=paragraphs.get(hit.part+'#'+hit.startNode);
 if(!el)return null;
 const info=el._wordEdit;
 if(!info||info.part!==hit.part)return null;
 let a=null,b=null,offset=0;
 for(const seg of info.segments){
  if(seg.index===hit.startNode&&a===null)a=offset+hit.startOffset;
  if(seg.index===hit.endNode&&b===null)b=offset+hit.endOffset;
  offset+=seg.value.length;
 }
 if(a===null||b===null||b<=a)return null;
 let nodes=nodeCache.get(el);
 if(!nodes){nodes=khmbPreviewTextPositions(el);nodeCache.set(el,nodes);}
 let start=null,finish=null;
 for(const n of nodes){
  if(!start&&a>=n.start&&a<n.end)start={node:n.node,offset:a-n.start};
  if(b>n.start&&b<=n.end){finish={node:n.node,offset:b-n.start};break;}
 }
 if(!start||!finish)return null;
 try{
  const range=document.createRange();
  range.setStart(start.node,start.offset);
  range.setEnd(finish.node,finish.offset);
  // Guard against offsets skewed by unsupported Word layout elements.
  if(range.toString()!==hit.match)return null;
  return {paragraph:el,range};
 }catch{return null;}
}
function khmbApplyPreviewHighlights(){

 const countEl=$('#khmbPreviewRedCount');
 if(countEl)countEl.remove();
 if(!state.isAdmin||!state.masterEditing||!state.khmbGlobalOpen||!state.khmbGlobalQuery)return;
 if(typeof CSS==='undefined'||!CSS.highlights||typeof Highlight==='undefined'){
  const count=$('#khmbMatchCount');
  if(count)count.title='浏览器不支持同时标注所有文字，请更新 Chrome 或 Edge';
  return;
 }
 const hits=state.khmbGlobalMatches||[];
 if(!hits.length)return;
 const index=khmbPreviewParagraphIndex(),cache=new Map(),ranges=[],active=[];
 for(let i=0;i<hits.length;i++){
  const item=khmbPreviewMatchRange(hits[i],index,cache);
  if(!item)continue;
  ranges.push(item.range);
  if(i===state.khmbActiveMatchIndex)active.push(item.range);
 }
 if(ranges.length)CSS.highlights.set(KHMB_ALL_MARK,new Highlight(...ranges));
 if(active.length)CSS.highlights.set(KHMB_ACTIVE_MARK,new Highlight(...active));
 const count=$('#khmbMatchCount');
 if(count){
  const span=document.createElement('span');
  span.id='khmbPreviewRedCount';
  span.className='khmb-highlight-count';
  span.textContent=' · 预览标红 '+ranges.length+' 处';
  span.title=ranges.length===hits.length?'已标记全部搜索结果':'部分结果位于脚注、批注或未在预览中呈现的内容，仍可在结果列表中查看和替换';
  count.append(span);
 }
}
function khmbJumpToMatch(index){

 const item=khmbPreviewMatchRange(hit,paragraphs,new Map());
 if(!item){toast('该处位于 '+khmbPartName(hit.part)+'，预览无法定位此段文字，但搜索和统一替换仍有效','error');return;}
 state.khmbActiveMatchIndex=index;
 khmbApplyPreviewHighlights();
 item.paragraph.classList.add('khmb-search-target');
 const scroller=$('#previewScroller');
 if(scroller){
  const rect=item.paragraph.getBoundingClientRect(),frame=scroller.getBoundingClientRect();
  scroller.scrollTop+=rect.top-frame.top-scroller.clientHeight/2+rect.height/2;

 try{window.getSelection()?.removeAllRanges();}catch{}
}

async function khmbReplaceAllText(search,replacement,sensitive){
 if(!state.masterEditing||!state.isAdmin||state.busy)return;
 const focused=document.activeElement;if(focused?.classList?.contains('docx-p'))focused.blur();
 const hits=khmbFindAll(search,sensitive);if(!hits.length){toast('当前没有匹配项');return;}
 const prev={...(state.active.directEdits||{})},edits={...prev};
 const parts=new Map(state.document.parts.map(p=>[p.part,p]));
 hits.sort((a,b)=>a.part===b.part?(b.startNode-a.startNode||b.startOffset-a.startOffset):b.part.localeCompare(a.part));
 for(const hit of hits){
  const data=parts.get(hit.part),first=manualKey(hit.part,hit.startNode),last=manualKey(hit.part,hit.endNode);
  const originalFirst=Object.hasOwn(edits,first)?String(edits[first]):data.nodes[hit.startNode].decoded;
  if(hit.startNode===hit.endNode)
   edits[first]=originalFirst.slice(0,hit.startOffset)+replacement+originalFirst.slice(hit.endOffset);
  else{
   const originalLast=Object.hasOwn(edits,last)?String(edits[last]):data.nodes[hit.endNode].decoded;
   edits[first]=originalFirst.slice(0,hit.startOffset)+replacement;
   for(let j=hit.startNode+1;j<hit.endNode;j++)edits[manualKey(hit.part,j)]='';
   edits[last]=originalLast.slice(hit.endOffset);
  }
 }

 state.directUndo.push({templateId:state.activeId,previous:prev,global:true});
 if(state.directUndo.length>70)state.directUndo.shift();

 toast('已批量处理 '+hits.length+' 处。点击「保存原模板并同步」才能发布线上');
}

   m.directEdits=matching?(local?.directEdits||{}):{};
 }
 await khmbOldLoadTemplate(id,scrollTop);
 if(state.activeId===id&&state.document){
   // Keep refresh/share URLs aligned with the selected template.
   const link=new URL(window.location.href);
   if(link.searchParams.get('template')!==id){
     link.searchParams.set('template',id);
     try{history.replaceState(history.state,'',link.toString());}catch{}
   }
 }
};
importDocxFiles=async function(files){
 if(!state.isAdmin){toast('请先登录管理员模式，才能上传模板','error');return;}
 const incoming=Array.from(files||[]).filter(f=>f.name.toLowerCase().endsWith('.docx'));
 if(!incoming.length){toast('请选择 DOCX 文件','error');return;}
 let uploaded=0,last=null;
 for(const f of incoming){
  try{
   if(f.size<1 || f.size>8*1024*1024)throw Error('单个模板必须在 8MB 以内');
   await parseDocx(f);
   const query=new URLSearchParams({name:documentName(f),filename:f.name});
   const ret=await khmbApi('/api/admin/docx/templates?'+query,{method:'POST',headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'},body:f});
   uploaded++;last=ret.id;
  }catch(e){toast(f.name+'：'+e.message,'error');}
 }
 await khmbRefresh();
 if(last)await loadTemplate(last);
 if(uploaded)toast('已上传 '+uploaded+' 份 DOCX，所有访客均可使用');
};

 await khmbRefresh();toast('固定输出文件名已同步线上');
}

reorderTemplate=async function(sourceId,targetId,after){
 if(!state.isAdmin){toast('只有管理员可调整模板顺序','error');return;}
 if(!sourceId||sourceId===targetId)return;
 const arr=ordered();const from=arr.findIndex(x=>x.id===sourceId),to=arr.findIndex(x=>x.id===targetId);if(from<0||to<0)return;
 const [item]=arr.splice(from,1);const idx=arr.findIndex(x=>x.id===targetId);arr.splice(idx+(after?1:0),0,item);
 try{await khmbApi('/api/admin/docx/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:arr.map(t=>t.id)})});await khmbRefresh();toast('模板顺序已同步到线上');}
 catch(e){toast(e.message,'error');await khmbRefresh();}
};
restoreBackup=async function(file){
 if(!state.isAdmin){toast('只有管理员可以恢复备份到线上','error');return;}
 try{
 const zip=await JSZip.loadAsync(file),json=zip.file('backup.json');if(!json)throw Error('无效的备份');
 const data=JSON.parse(await json.async('string'));if(!Array.isArray(data.items)||data.items.length>150)throw Error('备份清单无效或模板过多');
 let count=0,last=null;
 for(const item of data.items){
  const entry=zip.file(item.path);if(!entry)continue;
  const blob=await entry.async('blob');if(blob.size>8*1024*1024)continue;
  await parseDocx(blob);
  const name=String(item.metadata?.name||'恢复的模板'),filename=String(item.filename||name+'.docx');
  const ret=await khmbApi('/api/admin/docx/templates?'+new URLSearchParams({name,filename}),{method:'POST',headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'},body:blob});
  if(item.metadata?.outputName)await khmbApi('/api/admin/docx/templates/'+encodeURIComponent(ret.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({outputName:secureFileName(item.metadata.outputName)})});
  count++;last=ret.id;
 }
 await khmbRefresh();if(last)await loadTemplate(last);toast('成功恢复 '+count+' 个共享模板');
 }catch(e){toast('恢复失败：'+e.message,'error');}
};
const khmbOldBeginExport=beginExport;
beginExport=async function(){
 if(!state.document||state.busy)return;
 if(!secureFileName(state.active?.outputName)){
  showModal({iconName:'edit',title:'本次导出文件名',description:'管理员未设置此模板的固定输出文件名。此名称只对本次下载有效，不会更改线上模板设置。',input:true,label:'文件名',confirmText:'继续导出',onConfirm:value=>{state.khmbTempName=value;checkPendingAndExport();}});
  return;
 }
 return khmbOldBeginExport();
};

const KHMB_ARCHIVE_KEY=id=>'khmb-draft-previous:'+id;
function khmbNormalizedContexts(group){
 return (group?.occurrences||[]).map(o=>String(o.context||'').replace(/\s+/g,' ').trim()).sort();
}
function khmbGroupIsUnchanged(before,after){
 if(!before||!after||!before.occurrences||!after.occurrences)return false;
 if(before.occurrences.length!==after.occurrences.length)return false;
 const x=khmbNormalizedContexts(before),y=khmbNormalizedContexts(after);
 return x.every((v,i)=>v===y[i]);
}
function khmbPreviousDraft(){
 try{const data=localStorage.getItem(KHMB_ARCHIVE_KEY(state.activeId));return data?JSON.parse(data):null;}catch{return null;}
}
function khmbRenderPreviousDraftButton(){
 const old=document.querySelector('#khmbPreviousDraftButton');if(old)old.remove();
 if(!state.active||!khmbPreviousDraft())return;
 const holder=document.querySelector('.right-buttons')||document.querySelector('.right-footer');
 if(!holder)return;
 const b=document.createElement('button');b.id='khmbPreviousDraftButton';b.className='btn small';b.textContent='查看旧版未迁移内容';b.title='恢复前保存的个人填写记录，仅保存在当前浏览器';
 b.onclick=khmbShowPreviousDraft;holder.prepend(b);
}
function khmbShowPreviousDraft(){
 const archive=khmbPreviousDraft();if(!archive){toast('目前没有旧版记录');return;}
 const entries=Object.entries(archive.values||{}).filter(([,v])=>String(v)!=='');
 const textLines=['原模板版本：V'+archive.version,'存档时间：'+archive.savedAt,
  '未能安全迁移的中文字段（可手动复制到最新模板）：'];
 for(const [k,v] of entries){if(!archive.migratedKeys?.includes(k))textLines.push(k+' → '+v);}
 textLines.push('','原版全部填写记录：');
 for(const [k,v] of entries)textLines.push(k+' → '+v);
 const direct=Object.entries(archive.directEdits||{});
 if(direct.length){textLines.push('','未自动迁移的中间手动编辑：');for(const [k,v] of direct)textLines.push(k+' → '+v);}
 const area=document.querySelector('#modalRoot');
 area.innerHTML='<div class="modal-backdrop" id="khmbOldBackdrop"><div class="modal" style="max-width:610px" role="dialog" aria-modal="true"><h3>旧版本的个人填写存档</h3><p>这份记录仅保存在当前浏览器中。直接修改过的文字节点不能安全套用到新模板，请手动核对。</p><textarea id="khmbOldText" readonly style="box-sizing:border-box;width:100%;height:300px;border:1px solid #d1dae9;border-radius:8px;padding:12px;resize:vertical;font:12px/1.65 monospace"></textarea><div class="modal-foot"><button class="btn" id="khmbOldClose">关闭</button><button class="btn primary" id="khmbOldCopy">复制全部记录</button></div></div></div>';
 document.querySelector('#khmbOldText').value=textLines.join('\n');
 document.querySelector('#khmbOldClose').onclick=()=>area.innerHTML='';
 document.querySelector('#khmbOldBackdrop').onclick=e=>{if(e.target.id==='khmbOldBackdrop')area.innerHTML='';};
 document.querySelector('#khmbOldCopy').onclick=async()=>{
  const value=document.querySelector('#khmbOldText').value;
  try{await navigator.clipboard.writeText(value);toast('旧版记录已复制');}
  catch{const t=document.querySelector('#khmbOldText');t.select();document.execCommand('copy');toast('已选中旧版记录，请自行复制');}
 };
}
async function khmbGetLiveVersion(id){
 const r=await fetch('/api/admin/docx/templates/'+encodeURIComponent(id)+'/version?ts='+Date.now(),{method:'GET',cache:'no-store',headers:{'Cache-Control':'no-cache'}});
 const json=await r.json().catch(()=>null);
 if(!r.ok)throw Error(json?.error||'无法检查线上模板版本：HTTP '+r.status);
 const n=Number(json?.contentVersion);
 if(!Number.isSafeInteger(n)||n<1)throw Error('服务器返回的模板版本无效');
 return n;
}
function khmbOfferReload(current){
 const loaded=state.loadedTemplateVersion;
 showModal({iconName:'alert',title:'线上原模板已更新，旧版本禁止导出',
 description:'您打开时使用的是 V'+loaded+'，管理员已发布 V'+current+'。为避免使用过期文档，当前下载已被阻止。点击「加载最新模板」，系统会保存您的旧版填写记录，只自动恢复中文名称和上下文均能准确对应的字段；无法确认的内容可手动查看。',
 confirmText:'加载最新模板',cancelText:'继续检查已填写内容',onConfirm:khmbUpgradeCurrentDraft});
}
async function khmbUpgradeCurrentDraft(){
 if(state.busy||!state.active||!state.document)return;
 const id=state.activeId;
 const beforeVersion=state.loadedTemplateVersion;
 const oldGroups=state.document.groups.slice();
 const oldValues={...(state.active.values||{})};
 const oldDirect={...(state.active.directEdits||{})};
 const backup={version:beforeVersion,savedAt:new Date().toLocaleString(),values:oldValues,directEdits:oldDirect,migratedKeys:[]};
 try{localStorage.setItem(KHMB_ARCHIVE_KEY(id),JSON.stringify(backup));}
 catch(e){toast('无法保存旧版填写存档，请检查浏览器存储空间','error');return;}
 try{
  await khmbRefresh();
  await loadTemplate(id,false);
  if(!state.document||state.activeId!==id)throw Error('最新模板读取失败，旧版填写记录已保存在本地');
  const live=await khmbGetLiveVersion(id);
  if(state.loadedTemplateVersion!==live)throw Error('新版本尚未成功加载，请稍后重试');
  const allowed={};let migrated=0,unmatched=0;
  for(const [key,value] of Object.entries(oldValues)){
    if(value==='')continue;
    const before=oldGroups.find(g=>g.text===key);
    const after=state.document.groupMap.get(key);
    if(khmbGroupIsUnchanged(before,after)){allowed[key]=value;backup.migratedKeys.push(key);migrated++;}
    else unmatched++;
  }
  state.active.values=allowed;
  state.active.directEdits={};
  state.directUndo=[];
  await persistMeta(state.active);
  try{localStorage.setItem(KHMB_ARCHIVE_KEY(id),JSON.stringify(backup));}catch{}
  renderWorkspace(false);
  khmbRenderPreviousDraftButton();
  const directCount=Object.keys(oldDirect).length;
  const details='已经切换到原模板 V'+live+'。恢复 '+migrated+' 项完全匹配的填写，'+unmatched+' 项未自动迁移'+(directCount?'；'+directCount+' 处手动修改保留在旧版存档':'')+'。请检查预览后重新点击导出。';
  showModal({iconName:'check',title:'已加载最新原模板',description:details,confirmText:'我知道了'});
 }catch(e){toast('切换最新模板失败：'+e.message,'error');khmbRenderPreviousDraftButton();}
}
async function khmbCheckedExport(){
 if(!state.document||!state.active||state.busy)return;
 const id=state.activeId;
 if(state.masterEditing){toast('当前正在维护共享原模板，请先保存或取消维护','error');return;}
 state.busy=true;
 const button=document.querySelector('#exportButton');
 if(button){button.disabled=true;button.textContent='正在检查线上最新版本…';}
 try{
  const loaded=state.loadedTemplateVersion;
  if(!Number.isSafeInteger(loaded)||loaded<1)throw Error('当前文档未记录有效版本，请重新打开模板');
  const live=await khmbGetLiveVersion(id);
  if(live!==loaded){khmbOfferReload(live);return;}
  const filename=secureFileName(state.khmbTempName||state.active.outputName);
  if(!filename)throw Error('请先填写导出文件名');
  if(button)button.textContent='正在生成 DOCX…';
  const blob=await buildOutput();
  // Re-check immediately before downloading: do not export if admin updated while generating.
  const checkedAgain=await khmbGetLiveVersion(id);
  if(checkedAgain!==loaded){khmbOfferReload(checkedAgain);return;}
  if(state.activeId!==id||state.loadedTemplateVersion!==loaded)throw Error('模板已经切换，请重新点击导出');
  downloadBlob(blob,filename+'.docx');
  state.khmbTempName='';
  toast('已通过最新版本检查，DOCX 已开始下载');
 }catch(e){toast('为避免导出过期模板，已停止下载：'+e.message,'error');}
 finally{
  state.busy=false;
  if(button){button.disabled=false;button.innerHTML=icon('download',16)+' 导出 DOCX';}
 }
}
performExport=khmbCheckedExport;

 if(e.target.id==='outputName'&&!state.isAdmin){e.stopImmediatePropagation();e.target.value=state.active?.outputName||'';toast('只有管理员可以修改固定输出文件名','error');}
